[package]
name = "macro-recorder"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
description = "A modern, DPI-aware macro recorder with native Windows 11 Mica/Acrylic support"
license = "MIT"

[dependencies]
# GUI & Serialization
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Concurrency & Timing
crossbeam-channel = "0.5"
parking_lot = "0.12"
spin_sleep = "1.2"

# Error Handling & Logging
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Windows API Bindings
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",        # Added for reading System Accent Color
    "Win32_Media",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
