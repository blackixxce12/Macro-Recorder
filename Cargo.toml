[package]
name = "rust_macro_recorder"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
resolver = "2"

[dependencies]
eframe = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
spin_sleep = "1.2"
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Media",
    "Win32_Media_Audio", # <-- Добавлено для timeBeginPeriod / timeEndPeriod
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
]}

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
